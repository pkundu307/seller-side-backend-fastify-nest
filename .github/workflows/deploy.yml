name: Deploy Jottosop to VPS

on:
  push:
    branches:
      - production  # Triggers only on push to production branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Navigate to code folder and pull latest changes
            cd ~/seller-side-backend-fastify-nest
            git checkout production
            git pull origin production

            # 2. Navigate to infrastructure folder
            cd /opt/jottosop

            # 3. Rebuild and Re-up the main API (and other services if changed)
            # --build ensures Docker sees the new code pulled by git
            docker compose up --build -d main-api jottosop_notifications

            # 4. Run database migrations/sync
            docker exec jottosop_api npx prisma db push
            docker exec jottosop_api npx prisma generate


            # 5. Cleanup: Remove old/unused images to save VPS disk space (50GB limit)
            docker image prune -f