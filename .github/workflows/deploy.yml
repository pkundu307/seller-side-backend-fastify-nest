# .github/workflows/deploy.yml
name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/seller-side-backend-fastify-nest
            git pull origin main

            cd /opt/jottosop
            docker-compose stop main-api
            docker-compose rm -f main-api
            docker rmi jottosop-main-api --force || true
            docker-compose build --no-cache main-api
            docker-compose up -d main-api

            sleep 5
            docker logs jottosop_api --tail 30