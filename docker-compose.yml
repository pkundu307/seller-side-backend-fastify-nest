services:
  main-api:
    build:
      context: ./main-api
      dockerfile: Dockerfile
    container_name: jottosop_api
    restart: always
    
    # ⚠️ COMMENTED OUT for isolation testing. 
    # Uncomment these when you add the postgres/redis services back.
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    #   redis:
    #     condition: service_started
    #   rabbitmq:
    #     condition: service_healthy
    
    env_file:
      - ./main-api/.env 
    
    # ✅ FIX: Either remove this key completely or add variables like below.
    # I added connection string overrides here because typically
    # your .env has 'localhost', but Docker needs service names (e.g. 'postgres').
    environment:
      - NODE_ENV=production
      # - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?schema=public
      # - REDIS_HOST=redis
      # - REDIS_PORT=6379

    ports:
      - "3001:3001" 
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - jottosop_net

  redis:
    image: redis:alpine
    container_name: jottosop_redis
    restart: always
    command: redis-server --save 60 1 --loglevel warning --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - jottosop_net
    deploy:
      resources:
        limits:
          memory: 256M # Cap memory for your 4GB VPS
  postgres:
    image: postgres:17-alpine
    container_name: jottosop_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: jottosop123
      POSTGRES_DB: jottosop
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./prisma/migrations:/docker-entrypoint-initdb.d  # Auto-run Prisma migrations
    ports:
      - "5432:5432"  # Localhost:5432 → container:5432
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements,pg_trgm
      -c shared_preload_libraries=pg_stat_statements
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c max_connections=100
      -c log_statement=none
      -c log_min_duration_statement=250
    networks:
      - jottosop_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jottosop"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  jottosop_net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local