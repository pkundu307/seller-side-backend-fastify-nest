services:
  main-api:
    build:
      context: ./main-api
      dockerfile: Dockerfile
    container_name: jottosop_api
    restart: always
    
    # ⚠️ COMMENTED OUT for isolation testing. 
    # Uncomment these when you add the postgres/redis services back.
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    #   redis:
    #     condition: service_started
    #   rabbitmq:
    #     condition: service_healthy
    
    env_file:
      - ./main-api/.env 
    
    # ✅ FIX: Either remove this key completely or add variables like below.
    # I added connection string overrides here because typically
    # your .env has 'localhost', but Docker needs service names (e.g. 'postgres').
    environment:
      - NODE_ENV=production
      # - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?schema=public
      # - REDIS_HOST=redis
      # - REDIS_PORT=6379

    ports:
      - "3001:3001" 
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - jottosop_net

networks:
  jottosop_net:
    driver: bridge